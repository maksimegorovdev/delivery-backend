syntax = "proto3";

package order.v1;

import "buf/validate/validate.proto";
import "order/v1/order.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}

message CreateOrderItem {
  string product_id = 1 [(buf.validate.field).string.uuid = true];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
}

message CreateOrderRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string address_id = 2 [(buf.validate.field).string.uuid = true];
  repeated CreateOrderItem items = 3 [(buf.validate.field).repeated.min_items = 1];
}

message CreateOrderResponse {
  Order order = 1;
}
