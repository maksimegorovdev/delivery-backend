services:
  order-postgres:
    container_name: order-postgres
    image: postgres:18
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orderdb
    ports:
      - "5432:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/18/docker

  user-postgres:
    container_name: user-postgres
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=userdb
    ports:
      - "5433:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/18/docker

  product-postgres:
    container_name: product-postgres
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=productdb
    ports:
      - "5434:5432"
    volumes:
      - product-postgres-data:/var/lib/postgresql/18/docker

  notification-postgres:
    container_name: notification-postgres
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notificationdb
    ports:
      - "5435:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/18/docker

  redpanda:
    container_name: redpanda
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    container_name: redpanda-console
    image: redpandadata/console:v3.12.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "3000:8080"
    depends_on:
      - redpanda

  debezium:
    container_name: debezium
    image: quay.io/debezium/connect:3.6.3.Final
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: debezium-cdc-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    ports:
      - "8083:8083"
    depends_on:
      - order-postgres
      - redpanda

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_OTEL_WRITER_PASSWORD: otel_writer
      CLICKHOUSE_GRAFANA_READER_PASSWORD: grafana_reader
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/users.d/otel-users.xml:/etc/clickhouse-server/users.d/otel-users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "-q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_USER: otel_writer
      CLICKHOUSE_PASSWORD: otel_writer
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  order-postgres-data:
  user-postgres-data:
  product-postgres-data:
  notification-postgres-data:
  redpanda-data:
  clickhouse-data:
