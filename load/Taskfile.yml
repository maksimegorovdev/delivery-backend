# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  COMPOSE: docker compose -f {{.TASKFILE_DIR}}/compose.yaml -p delivery-load
  # Совпадает с FAKE_AUTH_USER_ID gateway в compose.yaml и сидом миграций user: адрес берётся у этого пользователя.
  SEED_USER_ID: 01a0d1fa-a4e8-75a1-802d-d6e3c642b0f3

tasks:
  up:
    desc: Start the load stack without the image check (prefer the root task load-up)
    cmds:
      - '{{.COMPOSE}} up -d --build --wait'

  down:
    desc: Remove the load stack with its volumes
    cmds:
      - '{{.COMPOSE}} down -v'

  k6:
    desc: Run the k6 scenario with PROFILE against a running stack (GATEWAY_URL overrides the target, RUN_ID names the results dir)
    internal: true
    silent: true
    requires:
      vars: [PROFILE]
    cmds:
      - |
        set -eu
        # k6 не умеет в SQL: seed-id берутся из БД стека и передаются в env сценария.
        address_id=$({{.COMPOSE}} exec -T user-postgres \
          psql -U postgres -d userdb -At \
          -c "SELECT id FROM addresses WHERE user_id = '{{.SEED_USER_ID}}' ORDER BY created_at LIMIT 1")
        product_ids=$({{.COMPOSE}} exec -T product-postgres \
          psql -U postgres -d productdb -At \
          -c "SELECT string_agg(id::text, ',' ORDER BY name) FROM products")
        if [ -z "$address_id" ] || [ -z "$product_ids" ]; then
          echo "seed-id не найдены: стек поднят (task load-up)?" >&2
          exit 1
        fi
        {{.COMPOSE}} run --rm \
          -e PROFILE={{.PROFILE}} \
          -e RUN_ID="{{.RUN_ID}}" \
          -e STRESS_RATES="${STRESS_RATES:-}" \
          -e GATEWAY_URL="${GATEWAY_URL:-http://gateway:8080}" \
          -e SEED_ADDRESS_ID="$address_id" \
          -e SEED_PRODUCT_IDS="$product_ids" \
          k6 run /scripts/create_order.js

  smoke:
    desc: k6 smoke against a running stack - 5 RPS for 1 min, fails on any failed check
    cmds:
      - task: k6
        vars: { PROFILE: smoke }

  stress:
    desc: k6 stress - RPS steps until degradation, summary and docker-stats.csv go to results/raw/<run> (STRESS_RATES overrides the steps)
    vars:
      RUN_ID:
        sh: date +%Y%m%d-%H%M%S
    cmds:
      - mkdir -p results/raw/{{.RUN_ID}}
      - cmd: |
          sh scripts/docker-stats.sh delivery-load results/raw/{{.RUN_ID}}/docker-stats.csv 5 >/dev/null 2>&1 &
          echo $! > results/raw/{{.RUN_ID}}/sampler.pid
      - defer: |
          pid=results/raw/{{.RUN_ID}}/sampler.pid
          if [ -f "$pid" ]; then kill "$(cat "$pid")" 2>/dev/null || true; rm -f "$pid"; fi
      # Код 99 у k6 — нарушены пороги: для stress штатный исход «предел найден». Исход решает вердикт в summary.json.
      - task: k6
        vars: { PROFILE: stress, RUN_ID: '{{.RUN_ID}}' }
        ignore_error: true
      - cmd: |
          summary=results/raw/{{.RUN_ID}}/summary.json
          if [ ! -f "$summary" ]; then echo "stress: summary.json не создан, прогон не состоялся" >&2; exit 1; fi
          if grep -q '"verdict": "failed"' "$summary"; then echo "stress: вердикт failed, см. $summary" >&2; exit 1; fi
          echo "stress: результаты в load/results/raw/{{.RUN_ID}}"
