# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  LOCAL_BIN: '{{.TASKFILE_DIR}}/bin'
  GOLANGCI_LINT_VERSION: v2.15.0
  GO_TEST_COVERAGE_VERSION: v2.21.0

tasks:
  tools:
    desc: Install local dev tools into ./bin
    env:
      GOBIN: '{{.LOCAL_BIN}}'
    cmds:
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b {{.LOCAL_BIN}} {{.GOLANGCI_LINT_VERSION}}
      - go install github.com/vladopajic/go-test-coverage/v2@{{.GO_TEST_COVERAGE_VERSION}}

  test:
    desc: Run unit tests (no Docker required)
    cmds:
      - go test -race -shuffle=on -count=1 ./...

  fuzz:
    desc: Run every fuzz target for FUZZTIME each (default 30s)
    vars:
      # go test -fuzz принимает одну цель на пакет, поэтому цели запускаются по очереди.
      FUZZ_TARGETS: ./http/bind:FuzzJSON
    cmds:
      - for: { var: FUZZ_TARGETS, split: ',' }
        cmd: |
          t="{{.ITEM}}"
          go test -run='^$' -fuzz="^${t##*:}\$" -fuzztime={{.FUZZTIME | default "30s"}} "${t%%:*}"

  test-integration:
    desc: Run integration tests (requires Docker)
    cmds:
      - go test -race -shuffle=on -count=1 -tags=integration ./...

  cover:
    desc: Run tests with coverage and check thresholds (requires Docker)
    cmds:
      - mkdir -p coverage
      - go test -race -count=1 -tags=integration -coverprofile=coverage/cover.out ./...
      - '{{.LOCAL_BIN}}/go-test-coverage --config=.testcoverage.yml --profile=coverage/cover.out'

  lint:
    desc: Run golangci-lint
    cmds:
      - '{{.LOCAL_BIN}}/golangci-lint run'

  lint-fix:
    desc: Run golangci-lint with autofix
    cmds:
      - '{{.LOCAL_BIN}}/golangci-lint run --fix'

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy