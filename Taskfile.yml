# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  MODULES: e2e,platform,proto,services/gateway,services/order,services/user,services/product,services/notification
  DB_SERVICES: order,user,product,notification
  # Модуль попадает в список вместе со своей первой fuzz-целью.
  FUZZ_MODULES: platform,services/order,services/notification
  COVER_MODULES: platform,services/gateway,services/order,services/user,services/product,services/notification

tasks:
  compose-up:
    desc: Start local infrastructure via docker compose
    cmds:
      - docker compose up -d --build

  connect-register:
    desc: Register the Debezium outbox connector
    cmds:
      - >
        curl -sS -X PUT
        -H 'Content-Type: application/json'
        --data @deploy/debezium/order-outbox.json
        http://localhost:8083/connectors/order-outbox/config

  compose-down:
    desc: Stop local infrastructure
    cmds:
      - docker compose down

  images-check:
    desc: Infrastructure image versions in a stack compose file match compose.yaml (FILE=..., PREFIX=<service image prefix>)
    internal: true
    silent: true
    requires:
      vars: [FILE, PREFIX]
    cmds:
      - |
        set -eu
        root=$(docker compose config --images | sort -u)
        # Образы сервисов ({{.PREFIX}}*), одноразовых контейнеров (migrate, curl) и генераторов нагрузки
        # (k6, ghz) в корневом файле не нужны.
        stack=$(docker compose -f {{.FILE}} --profile '*' config --images | sort -u \
          | grep -v -e '^{{.PREFIX}}' -e '^migrate/migrate:' -e '^curlimages/curl:' -e '^grafana/k6:' -e '^obvionaoe/ghz:')
        status=0
        for img in $stack; do
          if ! printf '%s\n' "$root" | grep -qxF "$img"; then
            echo "{{.FILE}}: образ $img не совпадает с compose.yaml" >&2
            status=1
          fi
        done
        exit $status

  e2e-images-check:
    desc: Infrastructure image versions in e2e/compose.yaml match compose.yaml
    silent: true
    cmds:
      - task: images-check
        vars: { FILE: e2e/compose.yaml, PREFIX: delivery-e2e- }

  e2e-up:
    desc: Start the isolated e2e stack (project delivery-e2e) and wait until it is ready
    cmds:
      - task: e2e-images-check
      - docker compose -f e2e/compose.yaml -p delivery-e2e up -d --build --wait

  e2e-test:
    desc: Run e2e tests against a running stack (task e2e-up); extra go test flags go after --
    dir: e2e
    cmds:
      - go test -race -shuffle=on -count=1 -tags=e2e {{.CLI_ARGS}} ./...

  e2e:
    desc: Bring up the e2e stack, run the tests, remove the stack (E2E_KEEP=1 keeps it)
    cmds:
      # defer объявлен до e2e-up: частично поднятый стек убирается и при падении подъёма.
      - defer: |
          if [ "${E2E_KEEP:-}" = "1" ]; then
            echo "E2E_KEEP=1: стек delivery-e2e оставлен (task e2e-logs, task e2e-down)"
          else
            task e2e-down
          fi
      - task: e2e-up
      - task: e2e-test

  e2e-down:
    desc: Remove the e2e stack with its volumes
    cmds:
      - docker compose -f e2e/compose.yaml -p delivery-e2e down -v

  load-up:
    desc: Start the isolated load stack (project delivery-load) and wait until it is ready
    cmds:
      - task: images-check
        vars: { FILE: load/compose.yaml, PREFIX: delivery-load- }
      - task -d load up

  load-down:
    desc: Remove the load stack with its volumes
    cmds:
      - task -d load down

  e2e-logs:
    desc: Show logs of the e2e stack (for failure analysis)
    cmds:
      - docker compose -f e2e/compose.yaml -p delivery-e2e logs --no-color {{.CLI_ARGS}}

  sync:
    desc: Sync the Go workspace
    cmds:
      - go work sync

  tools:
    desc: Install dev tools for every module
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} tools

  lint:
    desc: Run lint across every module
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} lint

  test:
    desc: Run unit tests across every module (no Docker required)
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} test

  fuzz:
    desc: Run fuzz targets in every module that has them (FUZZTIME per target, default 30s)
    cmds:
      - for: { var: FUZZ_MODULES, split: ',' }
        cmd: task -d {{.ITEM}} fuzz FUZZTIME={{.FUZZTIME | default "30s"}}

  test-integration:
    desc: Run integration tests across every module (requires Docker)
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} test-integration

  cover:
    desc: Run tests with coverage and check thresholds in every module (requires Docker)
    cmds:
      # Все модули проверяются до выхода: красный порог одного не скрывает остальные.
      - |
        status=0
        for m in $(echo '{{.COVER_MODULES}}' | tr ',' ' '); do
          echo "== $m"
          task -d "$m" cover || status=1
        done
        exit $status

  mocks:
    desc: Generate mocks in every module that has .mockery.yml
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: '[ ! -f {{.ITEM}}/.mockery.yml ] || task -d {{.ITEM}} mocks'

  tidy:
    desc: Tidy go.mod/go.sum for every module
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} tidy

  migrate-up:
    desc: Apply migrations for services with a database
    cmds:
      - for: { var: DB_SERVICES, split: ',' }
        cmd: task -d services/{{.ITEM}} migrate-up

  dev:
    desc: Start infrastructure and run all services with hot-reload
    cmds:
      - task: compose-up
      - task: watch-all

  watch-all:
    desc: Run all services with hot-reload (infrastructure must be up)
    deps:
      - task: svc-watch
        vars: { SVC: product }
      - task: svc-watch
        vars: { SVC: user }
      - task: svc-watch
        vars: { SVC: order }
      - task: svc-watch
        vars: { SVC: notification }
      - task: svc-watch
        vars: { SVC: gateway }

  svc-watch:
    internal: true
    prefix: '{{.SVC}}'
    cmds:
      - task -d services/{{.SVC}} watch
