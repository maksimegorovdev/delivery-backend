# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  MODULES: e2e,platform,proto,services/gateway,services/order,services/user,services/product,services/notification
  DB_SERVICES: order,user,product,notification
  # Модуль попадает в список вместе со своей первой fuzz-целью.
  FUZZ_MODULES: platform,services/order,services/notification
  COVER_MODULES: platform,services/gateway,services/order,services/user,services/product,services/notification

tasks:
  compose-up:
    desc: Start local infrastructure via docker compose
    cmds:
      - docker compose up -d --build

  connect-register:
    desc: Register the Debezium outbox connector
    cmds:
      - >
        curl -sS -X PUT
        -H 'Content-Type: application/json'
        --data @deploy/debezium/order-outbox.json
        http://localhost:8083/connectors/order-outbox/config

  compose-down:
    desc: Stop local infrastructure
    cmds:
      - docker compose down

  images-check:
    desc: Infrastructure image versions in a stack compose file match compose.yaml (FILE=..., PREFIX=<service image prefix>)
    internal: true
    silent: true
    requires:
      vars: [FILE, PREFIX]
    cmds:
      - |
        set -eu
        root=$(docker compose config --images | sort -u)
        # Образы сервисов ({{.PREFIX}}*), одноразовых контейнеров (migrate, curl) и генераторов нагрузки
        # (k6, ghz) в корневом файле не нужны.
        stack=$(docker compose -f {{.FILE}} --profile '*' config --images | sort -u \
          | grep -v -e '^{{.PREFIX}}' -e '^migrate/migrate:' -e '^curlimages/curl:' -e '^grafana/k6:' -e '^obvionaoe/ghz:')
        status=0
        for img in $stack; do
          if ! printf '%s\n' "$root" | grep -qxF "$img"; then
            echo "{{.FILE}}: образ $img не совпадает с compose.yaml" >&2
            status=1
          fi
        done
        exit $status

  e2e-images-check:
    desc: Infrastructure image versions in e2e/compose.yaml match compose.yaml
    silent: true
    cmds:
      - task: images-check
        vars: { FILE: e2e/compose.yaml, PREFIX: delivery-e2e- }

  e2e-up:
    desc: Start the isolated e2e stack (project delivery-e2e) and wait until it is ready
    cmds:
      - task: e2e-images-check
      - docker compose -f e2e/compose.yaml -p delivery-e2e up -d --build --wait

  e2e-test:
    desc: Run e2e tests against a running stack (task e2e-up); extra go test flags go after --
    dir: e2e
    cmds:
      - go test -race -shuffle=on -count=1 -tags=e2e {{.CLI_ARGS}} ./...

  e2e:
    desc: Bring up the e2e stack, run the tests, remove the stack (E2E_KEEP=1 keeps it)
    cmds:
      # defer объявлен до e2e-up: частично поднятый стек убирается и при падении подъёма.
      - defer: |
          if [ "${E2E_KEEP:-}" = "1" ]; then
            echo "E2E_KEEP=1: стек delivery-e2e оставлен (task e2e-logs, task e2e-down)"
          else
            task e2e-down
          fi
      - task: e2e-up
      - task: e2e-test

  e2e-down:
    desc: Remove the e2e stack with its volumes
    cmds:
      - docker compose -f e2e/compose.yaml -p delivery-e2e down -v

  load-up:
    desc: Start the isolated load stack (project delivery-load) and wait until it is ready
    cmds:
      - task: images-check
        vars: { FILE: load/compose.yaml, PREFIX: delivery-load- }
      - task -d load up

  load-down:
    desc: Remove the load stack with its volumes
    cmds:
      - task -d load down

  load-smoke:
    desc: k6 smoke against a running load stack (task load-up) - 5 RPS for 1 min
    cmds:
      - task -d load smoke

  load-stress:
    desc: k6 stress against a running load stack (task load-up) - RPS steps until degradation (STRESS_RATES overrides the steps)
    cmds:
      - task -d load stress

  load-regression:
    desc: k6 regression gate against a running load stack (task load-up) - 70% of the baseline limit for 5 min, fails when p95 or errors exceed baseline thresholds (REGRESSION_P95_MS overrides the p95 limit)
    cmds:
      - task -d load regression

  load-soak:
    desc: k6 soak against a running load stack (task load-up) - the regression RPS for 30 min, SQL snapshots at start and end (use a fresh stack)
    cmds:
      - task -d load soak

  load-lag:
    desc: Order -> notification lag by stage for the last load run (RUN=<dir in load/results/raw> picks another)
    cmds:
      - task -d load lag RUN={{.RUN}}

  load-grpc:
    desc: ghz against every gRPC method of a running load stack, concurrency steps (METHOD=<name in load/ghz> picks one, GHZ_STAGES and GHZ_DURATION override)
    cmds:
      - task -d load grpc METHOD={{.METHOD}}

  load-js-test:
    desc: Unit tests of the k6 scenario logic with node --test (no stack needed)
    cmds:
      - task -d load js-test

  bench:
    desc: Go benchmarks of the hot paths into load/bench/new.txt
    cmds:
      - task -d load bench

  bench-compare:
    desc: benchstat of load/bench/baseline.txt against load/bench/new.txt
    cmds:
      - task -d load bench-compare

  bench-baseline:
    desc: Overwrite load/bench/baseline.txt with the current load/bench/new.txt (by hand, after an intentional change)
    cmds:
      - task -d load bench-baseline

  load:
    desc: Bring up the load stack, run smoke, remove the stack (LOAD_KEEP=1 keeps it)
    cmds:
      # defer объявлен до load-up: частично поднятый стек убирается и при падении подъёма.
      - defer: |
          if [ "${LOAD_KEEP:-}" = "1" ]; then
            echo "LOAD_KEEP=1: стек delivery-load оставлен (task load-down)"
          else
            task load-down
          fi
      - task: load-up
      - task: load-smoke

  e2e-logs:
    desc: Show logs of the e2e stack (for failure analysis)
    cmds:
      - docker compose -f e2e/compose.yaml -p delivery-e2e logs --no-color {{.CLI_ARGS}}

  sync:
    desc: Sync the Go workspace
    cmds:
      - go work sync

  tools:
    desc: Install dev tools for every module
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} tools

  lint:
    desc: Run lint across every module
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} lint

  test:
    desc: Run unit tests across every module (no Docker required)
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} test

  fuzz:
    desc: Run fuzz targets in every module that has them (FUZZTIME per target, default 30s)
    cmds:
      - for: { var: FUZZ_MODULES, split: ',' }
        cmd: task -d {{.ITEM}} fuzz FUZZTIME={{.FUZZTIME | default "30s"}}

  test-integration:
    desc: Run integration tests across every module (requires Docker)
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} test-integration

  cover:
    desc: Run tests with coverage and check thresholds in every module (requires Docker)
    cmds:
      # Все модули проверяются до выхода: красный порог одного не скрывает остальные.
      - |
        status=0
        for m in $(echo '{{.COVER_MODULES}}' | tr ',' ' '); do
          echo "== $m"
          task -d "$m" cover || status=1
        done
        exit $status

  mocks:
    desc: Generate mocks in every module that has .mockery.yml
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: '[ ! -f {{.ITEM}}/.mockery.yml ] || task -d {{.ITEM}} mocks'

  tidy:
    desc: Tidy go.mod/go.sum for every module
    cmds:
      - for: { var: MODULES, split: ',' }
        cmd: task -d {{.ITEM}} tidy

  migrate-up:
    desc: Apply migrations for services with a database
    cmds:
      - for: { var: DB_SERVICES, split: ',' }
        cmd: task -d services/{{.ITEM}} migrate-up

  dev:
    desc: Start infrastructure and run all services with hot-reload
    cmds:
      - task: compose-up
      - task: watch-all

  watch-all:
    desc: Run all services with hot-reload (infrastructure must be up)
    deps:
      - task: svc-watch
        vars: { SVC: product }
      - task: svc-watch
        vars: { SVC: user }
      - task: svc-watch
        vars: { SVC: order }
      - task: svc-watch
        vars: { SVC: notification }
      - task: svc-watch
        vars: { SVC: gateway }

  pprof:
    desc: >-
      Save a pprof snapshot of a running service into tmp/pprof (dev debug ports 6060-6064).
      SERVICE=gateway|order|user|product|notification,
      TYPE=profile|heap|allocs|goroutine|goroutineleak|mutex|block|trace (default profile),
      SECONDS=30 for profile and trace
    silent: true
    requires:
      vars: [SERVICE]
    vars:
      TYPE: '{{.TYPE | default "profile"}}'
      SECONDS: '{{.SECONDS | default "30"}}'
    cmds:
      - |
        # Порт debug-сервера по имени сервиса (таблица портов в спеке profiling).
        case "{{.SERVICE}}" in
          gateway)      port=6060 ;;
          order)        port=6061 ;;
          user)         port=6062 ;;
          product)      port=6063 ;;
          notification) port=6064 ;;
          *) echo "pprof: unknown SERVICE '{{.SERVICE}}' (gateway|order|user|product|notification)" >&2; exit 1 ;;
        esac

        # goroutineleak есть с Go 1.27: горутины, заблокированные навсегда на недостижимых примитивах.
        case "{{.TYPE}}" in
          profile|trace) path="{{.TYPE}}?seconds={{.SECONDS}}" ;;
          heap|allocs|goroutine|goroutineleak|mutex|block) path="{{.TYPE}}" ;;
          *) echo "pprof: unknown TYPE '{{.TYPE}}' (profile|heap|allocs|goroutine|goroutineleak|mutex|block|trace)" >&2; exit 1 ;;
        esac

        case "{{.SECONDS}}" in
          ''|*[!0-9]*) echo "pprof: SECONDS must be a positive integer, got '{{.SECONDS}}'" >&2; exit 1 ;;
        esac

        ext=pb.gz
        [ "{{.TYPE}}" = trace ] && ext=trace

        mkdir -p tmp/pprof
        out="tmp/pprof/{{.SERVICE}}-{{.TYPE}}-$(date +%Y%m%d-%H%M%S).$ext"

        # Запас сверх SECONDS на сам ответ; при любой ошибке пустой файл не оставляем.
        if ! curl -fsS --max-time $(( {{.SECONDS}} + 15 )) -o "$out" "http://127.0.0.1:$port/debug/pprof/$path"; then
          rm -f "$out"
          echo "pprof: {{.SERVICE}} debug endpoint 127.0.0.1:$port is unavailable (is the service running with PPROF_ADDR set?)" >&2
          exit 1
        fi

        echo "$out"
        if [ "{{.TYPE}}" = trace ]; then
          echo "view: go tool trace $out"
        else
          echo "view: go tool pprof -http=:0 $out"
        fi

  svc-watch:
    internal: true
    prefix: '{{.SVC}}'
    cmds:
      - task -d services/{{.SVC}} watch
